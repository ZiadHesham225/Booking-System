<div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
  <form [formGroup]="searchForm" (ngSubmit)="onSearch()">
    <!-- Main Search Bar -->
    <div class="flex flex-col md:flex-row gap-4">
      <div class="flex-1 relative">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <input 
          type="text" 
          formControlName="searchTerm"
          placeholder="Search events by name, location..."
          class="form-input pl-10"
        />
      </div>
      
      <div class="flex gap-2">
        <button type="submit" class="btn-primary">
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          Search
        </button>
        
        <button 
          type="button" 
          (click)="toggleFilters()"
          class="btn-secondary"
        >
          <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path>
          </svg>
          Filters
        </button>
      </div>
    </div>

    <!-- Advanced Filters -->
    @if (showFilters) {
      <div class="mt-4 pt-4 border-t border-gray-200">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          <!-- Category -->
          <div>
            <label class="form-label">Category</label>
            <select formControlName="categoryId" class="form-input">
              <option value="">All Categories</option>
              @for (category of categories; track category.id) {
                <option [value]="category.id">{{ category.name }}</option>
              }
            </select>
          </div>

          <!-- Date Range -->
          <div>
            <label class="form-label">Start Date</label>
            <input type="date" formControlName="startDate" class="form-input" />
          </div>

          <div>
            <label class="form-label">End Date</label>
            <input type="date" formControlName="endDate" class="form-input" />
          </div>

          <!-- Sort By -->
          <div>
            <label class="form-label">Sort By</label>
            <select formControlName="sortBy" class="form-input">
              <option value="date">Date</option>
              <option value="title">Title</option>
              <option value="price">Price</option>
            </select>
          </div>

          <!-- Price Range -->
          <div>
            <label class="form-label">Min Price</label>
            <input type="number" formControlName="minPrice" min="0" placeholder="0" class="form-input" />
          </div>

          <div>
            <label class="form-label">Max Price</label>
            <input type="number" formControlName="maxPrice" min="0" placeholder="Any" class="form-input" />
          </div>

          <!-- Sort Order -->
          <div class="flex items-end">
            <label class="flex items-center cursor-pointer">
              <input type="checkbox" formControlName="isDescending" class="form-checkbox" />
              <span class="ml-2 text-sm text-gray-700">Descending Order</span>
            </label>
          </div>

          <!-- Clear Filters -->
          <div class="flex items-end">
            <button type="button" (click)="clearFilters()" class="btn-secondary w-full">
              Clear Filters
            </button>
          </div>
        </div>
      </div>
    }
  </form>
</div>
